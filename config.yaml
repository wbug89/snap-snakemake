# SNaP — Snakemake for NGS and Polyploids — v1.0.0
#
# Stages:
#   preprocess      FASTQ -> trim -> align -> sort -> MarkDuplicates
#   gvcf            marked BAMs -> merge all units per biological sample -> HaplotypeCaller GVCF
#   joint           single-server joint calling for ALL reference contigs:
#                   GenomicsDBImport -> per-contig GenotypeGVCFs -> concat -> filter
#   joint_shard     distributed joint calling: run only contigs assigned to this server/partition
#   joint_finalize  collect ALL per-contig VCFs from joint_shard servers -> concat -> filter
#   full            single-server FASTQ -> preprocess -> gVCF -> GenomicsDB joint -> filter
workflow_stage: preprocess

read_layout: PE
batch_id: batch1
ploidy: 6

project_dir: /path/to/project
fastq_dir: /path/to/project/rawData
reference: /path/to/reference.fa

# Biological sample grouping. Capture group 1 overrides the automatic heuristic.
# Sweetpotato example: IB001 / IBC1 / TN71
sample_group_regex: '^((?:IBC?|TN)[0-9]+)'

exclude_units: []
include_biological_samples: []
exclude_biological_samples: []
include_biological_samples_file: null
exclude_biological_samples_file: null

# gvcf stage: optional distributed sample assignment.
# TSV header: biological_sample<TAB>server
sample_assignment_file: null
calling_partition: null

# gvcf stage inputs.
marked_dirs: []

# joint / joint_shard inputs. BOTH servers must be able to read the complete cohort gVCFs.
gvcf_dirs: []

# joint_shard only: assign every reference contig to exactly one partition.
# TSV header: contig<TAB>server
joint_contig_assignment_file: null
joint_partition: null

# joint_finalize only: one or more directories containing completed
# per-contig VCFs named 000001.vcf.gz, 000002.vcf.gz, ... and .tbi indexes.
per_contig_dirs: []

tools:
  java: java
  bwa: bwa
  samtools: samtools
  bcftools: bcftools
  gatk: gatk
  trimmomatic: trimmomatic

trimmomatic:
  phred: -phred33
  threads: 8
  leading: 3
  trailing: 3
  slidingwindow: '4:30'
  minlen: 36
  builtin_adapter_se: NexteraPE-PE.fa
  builtin_adapter_pe: NexteraPE-PE.fa
  user_adapter_se: /path/to/fallback/SE_adapter.fa
  user_adapter_pe: /path/to/fallback/PE_adapter.fa
  illuminaclip_se: '2:30:10'
  illuminaclip_pe: '2:30:10'

resources:
  bwa_threads: 12
  samtools_view_threads: 4
  samtools_sort_threads: 8
  haplotypecaller_threads: 2

java_options:
  markduplicates: '-Xmx20g'
  haplotypecaller: '-Xmx20g'
  # Joint calling is deliberately conservative because GATK/GenomicsDB also uses native/off-heap memory.
  genomicsdbimport: '-Xmx16g -XX:ParallelGCThreads=2'
  genotypegvcfs: '-Xmx32g -XX:ParallelGCThreads=2'

# Per-job Snakemake resource declarations for joint jobs.
# IMPORTANT: these do NOT cap whole-machine usage by themselves.
# At runtime also pass, for example on PC3:
#   --resources joint_jobs=1 mem_mb=120000
# or on PC1 after validation:
#   --resources joint_jobs=2 mem_mb=200000
genomicsdb:
  batch_size: 30
  reader_threads: 1
  import_mem_mb: 24000
  genotype_mem_mb: 40000

calling:
  minimum_mapping_quality: 30
  # Explicitly retain GATK defaults that constrain genotype-state explosion in hexaploid multiallelic sites.
  max_alternate_alleles: 6
  max_genotype_count: 1024
  hard_filter_expression: 'QD < 2.0 || FS > 60.0 || MQ < 40.0 || MQRankSum < -12.5 || ReadPosRankSum < -8.0'

telegram:
  enabled: false
  bot_token: ''
  chat_id: ''

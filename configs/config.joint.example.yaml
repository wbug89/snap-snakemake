# SNaP v1.0.3 configuration — stage: joint
# Copy *.example.yaml to a local config before editing. Do not commit credentials.

workflow_stage: joint

# ---------- Core ----------
read_layout: PE                  # SE or PE; used by preprocess/full
batch_id: batch1                # unique preprocessing batch ID
ploidy: 6                       # 2=diploid, 6=hexaploid, etc.
project_dir: /path/to/joint_output
fastq_dir: /path/to/rawData          # preprocess/full only
reference: /path/to/reference.fa
sample_group_regex: '^((?:SM)[0-9]{3})'

exclude_units: []
include_biological_samples: []
exclude_biological_samples: []
include_biological_samples_file: null
exclude_biological_samples_file: null

# ---------- Stage inputs ----------
marked_dirs: []
sample_assignment_file: null
calling_partition: null

gvcf_dirs: [/path/to/gvcf_dir_1, /path/to/gvcf_dir_2]
joint_contig_assignment_file: null
joint_partition: null

per_contig_dirs: []

# ---------- Reference sequence selection ----------
# mode: all | regex | min_length | list | file
reference_intervals:
  mode: all
  regex: null                    # e.g. '^chr[0-9]+$' or '^LG[0-9]+$'
  min_length: null               # bp, e.g. 1000000
  sequences: []                  # used by mode: list
  file: null                     # one sequence name per line; used by mode: file

# ---------- Joint sharding ----------
# contig = one selected reference sequence per shard
# balanced = deterministic length-balanced groups of selected sequences
joint_sharding:
  strategy: contig               # contig | balanced
  shards: null                   # used by balanced; null -> min(8, selected sequences)

# ---------- Executables ----------
tools:
  java: java
  bwa: bwa
  samtools: samtools
  bcftools: bcftools
  gatk: gatk
  trimmomatic: trimmomatic

# ---------- Trimmomatic ----------
trimmomatic:
  phred: -phred33
  leading: 3
  trailing: 3
  slidingwindow: '4:30'
  minlen: 36
  builtin_adapter_se: NexteraPE-PE.fa
  builtin_adapter_pe: NexteraPE-PE.fa
  user_adapter_se: null
  user_adapter_pe: null
  illuminaclip_se: '2:30:10'
  illuminaclip_pe: '2:30:10'

# ---------- Per-rule default resources ----------
# Workflow profiles may override these with set-threads/set-resources.
# Java -Xmx is derived automatically from the final rule mem_mb (~75%).
resources:
  trimmomatic_threads: 2
  trimmomatic_mem_mb: 2048
  bwa_threads: 4
  bwa_mem_mb: 4096
  samtools_view_threads: 1
  samtools_sort_threads: 2
  samtools_sort_mem_mb: 4096
  markduplicates_mem_mb: 6144
  merge_bam_mem_mb: 4096
  haplotypecaller_threads: 2
  haplotypecaller_mem_mb: 8192
  bcftools_mem_mb: 2048

# Optional JVM flags appended after the automatically generated -Xmx.
java_options:
  markduplicates_extra: ''
  haplotypecaller_extra: ''
  genomicsdbimport_extra: '-XX:ParallelGCThreads=2'
  genotypegvcfs_extra: '-XX:ParallelGCThreads=2'

# ---------- GenomicsDB ----------
genomicsdb:
  batch_size: 30
  reader_threads: 1
  import_mem_mb: 8192
  genotype_mem_mb: 12288

# ---------- Calling / filtering ----------
calling:
  minimum_mapping_quality: 30
  max_alternate_alleles: 6
  max_genotype_count: 1024
  hard_filter_expression: 'QD < 2.0 || FS > 60.0 || MQ < 40.0 || MQRankSum < -12.5 || ReadPosRankSum < -8.0'

# ---------- Telegram ----------
# Prefer environment variables TG_BOT_TOKEN and TG_CHAT_ID so secrets stay out of Git.
telegram:
  enabled: false
  bot_token: ''
  chat_id: ''

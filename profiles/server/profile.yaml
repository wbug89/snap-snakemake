# SNaP server profile: intended for >=128 GiB RAM.
cores: 30
resources:
  mem_mb: 150000
  joint_jobs: 2
rerun-incomplete: true
set-threads:
  trim_fastq_se: 8
  trim_fastq_pe: 8
  bwa_mapping: 12
  samtools_sort_index: 8
  gatk_haplotypecaller: 2
set-resources:
  trim_fastq_se:
    mem_mb: 4096
  trim_fastq_pe:
    mem_mb: 4096
  bwa_mapping:
    mem_mb: 12000
  samtools_sort_index:
    mem_mb: 12000
  mark_duplicates:
    mem_mb: 20000
  merge_marked_bam:
    mem_mb: 12000
  gatk_haplotypecaller:
    mem_mb: 20000
  genomicsdb_import:
    mem_mb: 24000
  genotype_gvcfs:
    mem_mb: 40000
  concat_joint_vcfs:
    mem_mb: 8000
